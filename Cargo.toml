[package]
name = "outlook-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "Microsoft Outlook from your terminal, for humans and agents"
license = "MIT"
repository = "https://github.com/rvben/outlook-cli"
homepage = "https://github.com/rvben/outlook-cli"
readme = "README.md"
keywords = ["outlook", "microsoft-graph", "email", "calendar", "cli"]
categories = ["command-line-utilities", "email"]

[[bin]]
name = "outlook"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
dirs = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.1"
url = "2"

[dev-dependencies]
assert_cmd = "2"
jsonschema = "0.49.8"
predicates = "3"
wiremock = "0.6"
