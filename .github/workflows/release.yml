name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified packages (requires a version tag and registry secrets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  wheels:
    name: Wheel (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            compatibility: '2014'
            container: quay.io/pypa/manylinux2014_x86_64:latest
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            compatibility: '2014'
            container: quay.io/pypa/manylinux2014_aarch64:latest
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            compatibility: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_x86_64:latest
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            compatibility: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_aarch64:latest
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            compatibility: auto
            container: off
          - os: macos-15-intel
            target: x86_64-apple-darwin
            compatibility: auto
            container: off
          - os: macos-latest
            target: aarch64-apple-darwin
            compatibility: auto
            container: off
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --release --locked --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.compatibility }}
          container: ${{ matrix.container }}
          rust-toolchain: '1.90.0'
          before-script-linux: |
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache cmake make perl pkgconf
            fi
      - name: Verify uv installation without source builds
        if: ${{ !contains(matrix.target, '-musl') }}
        run: python scripts/release.py smoke dist
      - name: Verify musl wheel in Alpine without Rust
        if: contains(matrix.target, '-musl')
        shell: bash
        run: |
          docker run --rm -v "$PWD:/io:ro" -w /io \
            ghcr.io/astral-sh/uv:python3.12-alpine \
            python scripts/release.py smoke dist
      - name: Package standalone executable and checksum
        run: python scripts/release.py archive dist --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  source:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source
          path: dist/*.tar.gz
          if-no-files-found: error

  verify:
    needs: [wheels, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - run: python scripts/release.py verify dist
      - run: uv tool run --from twine twine check dist/*.whl dist/outlook_cli_rs-*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error

  # Building a tag never publishes a partial platform set. Publication is an
  # explicit dispatch on that tag after all build and installation checks pass.
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: dist
      - name: Check tag and credentials before publishing anything
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python scripts/release.py verify dist --require-tag "$GITHUB_REF_NAME"
          test "$GITHUB_REF_TYPE" = tag
          test -n "$CARGO_REGISTRY_TOKEN"
          test -n "$TWINE_PASSWORD"
      - name: Publish crates.io package
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
      - name: Publish all Python packages
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: uv tool run --from twine twine upload --non-interactive dist/*.whl dist/outlook_cli_rs-*.tar.gz
      - name: Publish executable archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py notes > release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md dist/outlook-v* dist/SHA256SUMS
